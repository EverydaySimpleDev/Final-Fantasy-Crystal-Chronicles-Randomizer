# Builds the patcher for Windows and Linux. PyInstaller can only build for the
# system it runs on, so each one is built on its own runner.
#
# Run it by hand from the Actions tab ("Run workflow"), or push a tag such as
# v0.4.0: a tag also attaches both files to that tag's GitHub release.
#
# The Linux build is made on Ubuntu 22.04 on purpose. A Linux program only
# runs where the system's C library is at least as new as the one it was
# built with, so an older build runs on more distributions.

name: Build patcher

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: FFCC-Randomizer-windows
            file: dist/FFCC-Randomizer.exe
          - os: ubuntu-22.04
            artifact: FFCC-Randomizer-linux
            file: FFCC-Randomizer-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pyinstaller pillow numpy

      - name: Build
        run: python -m PyInstaller FFCC-Randomizer.spec --noconfirm

      # a .tar.gz keeps the file's "executable" permission, a .zip upload doesn't
      - name: Pack the Linux build
        if: runner.os == 'Linux'
        run: tar -czf FFCC-Randomizer-linux.tar.gz -C dist FFCC-Randomizer

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file }}
